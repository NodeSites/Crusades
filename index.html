<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الحروب الصليبية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root{
  --void:#0d0a07; --void2:#161009; --parchment:#e9ddc0; --gold:#c9a227;
  --gold-dim:#8a721f; --blood:#7c2230; --ink:#efe6cf;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  background:radial-gradient(ellipse at 50% 30%, #1c130a 0%, var(--void) 70%);
  color:var(--ink); font-family:'Tajawal',sans-serif; overflow:hidden;
  height:100%; width:100%; position:fixed; inset:0;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  touch-action:none;
}
.stage{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column;}

#start{ z-index:10; transition:opacity .6s ease; gap:2.5rem; }
#icon-wrap{ width:160px; height:160px; position:relative; display:flex; align-items:center; justify-content:center; }
.sword-euro, .sword-arab { 
  position:absolute; inset:0; width:100%; height:100%; 
  filter:drop-shadow(0 4px 10px rgba(0,0,0,0.6)); opacity:0; 
}
.clash-flash {
  position:absolute; top:50%; left:50%; width:140px; height:140px;
  margin:-70px 0 0 -70px; pointer-events:none;
  background:radial-gradient(circle, #ffffff 10%, #ffdc73 35%, transparent 70%);
  mix-blend-mode:screen; opacity:0; transform:scale(0); z-index:5;
}

#icon-wrap.animating .sword-euro { animation:swing-euro 0.3s cubic-bezier(.17,.89,.32,1.28) forwards; }
#icon-wrap.animating .sword-arab { animation:swing-arab 0.3s cubic-bezier(.17,.89,.32,1.28) forwards 0.05s; }
#icon-wrap.animating .clash-flash { animation:flash-boom 0.6s ease-out forwards 0.15s; }
#icon-wrap.animating { animation:cam-shake 0.35s ease-in-out 0.15s; }

@keyframes swing-euro {
  0% { transform:translate(-60px, 60px) rotate(-45deg); opacity:0; }
  100% { transform:translate(0, 0) rotate(0deg); opacity:1; }
}
@keyframes swing-arab {
  0% { transform:translate(60px, 60px) rotate(45deg); opacity:0; }
  100% { transform:translate(0, 0) rotate(0deg); opacity:1; }
}
@keyframes flash-boom {
  0% { transform:scale(0); opacity:1; filter:brightness(2); }
  15% { transform:scale(1.1); opacity:1; filter:brightness(1.5); }
  100% { transform:scale(2.5); opacity:0; filter:brightness(1); }
}
@keyframes cam-shake {
  0%,100%{ transform:translate(0,0); }
  25%{ transform:translate(8px,8px); }
  50%{ transform:translate(-8px,-4px); }
  75%{ transform:translate(4px,-8px); }
}

#start-btn{
  font-family:'Amiri',serif; font-size:1.6rem; color:var(--void);
  background:linear-gradient(180deg,#e2c467,var(--gold-dim));
  border:1px solid #3a2f12; border-radius:4px; padding:.7rem 3.5rem;
  cursor:pointer; letter-spacing:.05em; transition:all 0.2s;
  box-shadow:0 2px 0 #4a3a15, 0 10px 24px rgba(0,0,0,.5);
}
#start-btn:hover{ filter:brightness(1.1); transform:translateY(-1px); box-shadow:0 4px 0 #4a3a15, 0 12px 28px rgba(0,0,0,.6); }
#start-btn:active{ transform:translateY(2px); box-shadow:0 0 0 #4a3a15; }
#start-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }
#loadbar-track{ width:220px; height:4px; background:#2b2013; border-radius:2px; overflow:hidden; opacity:0; transition:opacity .3s; }
#loadbar-track.show{ opacity:1; }
#loadbar-fill{ height:100%; width:0%; background:var(--gold); transition:width 2.1s cubic-bezier(.4,0,.2,1); }

#black-screen{
  position:fixed; inset:0; z-index:9; background-color:#000;
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .7s ease;
}
#black-screen.show{ opacity:1; pointer-events:auto; }
#red-title{
  font-family:'Amiri',serif; font-weight:700; font-size:4rem; color:var(--gold);
  opacity:0; transition:opacity .5s ease; text-align:center;
  text-shadow: 0 0 30px rgba(201,162,39,0.4);
}
#red-title.show{ opacity:1; }

#deck{ position:absolute; inset:0; perspective:1400px; z-index:5; opacity:0; pointer-events:none; }
#deck.show{ opacity:1; pointer-events:auto; transition:opacity .5s ease; }
.page{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:2rem 1.5rem; text-align:center; transform-style:preserve-3d; backface-visibility:hidden;
  transition:transform 2s cubic-bezier(.6,0,.25,1), opacity 1.6s ease;
  background:radial-gradient(ellipse at 50% 0%, rgba(201,162,39,.06), transparent 60%);
}
.page::before{
  content:''; position:absolute; inset:8% 10%; border:1px solid rgba(201,162,39,.12); pointer-events:none;
}
.page .eyebrow{ font-size:.9rem; color:var(--gold); margin-bottom:.6rem; font-weight:600; }
.page h2{ font-family:'Amiri',serif; font-size:2.2rem; color:var(--parchment); margin-bottom:1.2rem; }
.page p{ 
  max-width:580px; line-height:1.95; font-size:1.1rem; font-weight:300; color:#d9cdae; 
  text-align:justify; max-height:45vh; overflow-y:auto; padding-left:10px; padding-right:10px;
  scrollbar-width:thin; scrollbar-color:var(--gold-dim) transparent;
}
.page p::-webkit-scrollbar{ width:4px; }
.page p::-webkit-scrollbar-thumb{ background:var(--gold-dim); border-radius:4px; }

.page-box{
  background:rgba(18,13,7,.6); border:1px solid rgba(201,162,39,.35); border-radius:10px;
  padding:2.2rem 1.8rem; max-width:680px; width:100%; display:flex; flex-direction:column; align-items:center;
  box-shadow:0 20px 55px rgba(0,0,0,.55); backdrop-filter:blur(3px);
}
.page.active{ transform:translateX(0) translateY(0) translateZ(0) rotate(0deg) scale(1); opacity:1; z-index:2; filter:none; }
.page.next{
  transform:translateX(135%) translateY(-6%) translateZ(-420px) rotateY(42deg) rotate(9deg) scale(.85);
  opacity:0; z-index:1; filter:blur(1px);
}
.page.prev{
  transform:translateX(-135%) translateY(7%) translateZ(-420px) rotateY(-42deg) rotate(-8deg) scale(.85);
  opacity:0; z-index:1; filter:blur(1px);
}

.dots{ position:absolute; bottom:calc(env(safe-area-inset-bottom,0px) + 1.4rem); left:50%; transform:translateX(-50%); display:flex; gap:.5rem; z-index:6; }
.dot{ width:7px; height:7px; border-radius:50%; background:#4a3f2a; transition:background .3s; }
.dot.active{ background:var(--gold); }
.hint{ position:absolute; bottom:calc(env(safe-area-inset-bottom,0px) + 2.6rem); left:50%; transform:translateX(-50%); font-size:.8rem; color:#7a6f52; z-index:6; }
.arrow-btn{ position:absolute; top:50%; transform:translateY(-50%); z-index:6; background:none; border:none; color:var(--gold-dim); font-size:2.2rem; cursor:pointer; padding:.5rem 1rem; transition:color 0.2s;}
.arrow-btn:hover{ color:var(--gold); }
.arrow-btn:focus-visible{ outline:2px solid var(--gold); }
#prev-btn{ right:.5rem; } #next-btn{ left:.5rem; }

.stats-grid{ display:grid; grid-template-columns:repeat(3,minmax(90px,1fr)); gap:1.6rem 1.2rem; max-width:620px; }
.stat-block{ display:flex; flex-direction:column; align-items:center; }
.stat-num{ font-family:'Amiri',serif; font-weight:700; font-size:2.6rem; color:var(--gold); line-height:1; }
.stat-label{ font-size:.85rem; color:#c9bd9d; margin-top:.4rem; max-width:120px; }

.quiz-wrap{ width:100%; max-width:560px; max-height:50vh; overflow-y:auto; padding:0 .4rem; }
.quiz-q{ margin-bottom:1.5rem; text-align:right; }
.quiz-q p{ font-size:1.05rem; color:var(--parchment); margin-bottom:.6rem; max-width:none; line-height:1.7; text-align:right; }
.quiz-opts{ display:flex; flex-direction:column; gap:.5rem; }
.quiz-opt{
  font-family:'Tajawal',sans-serif; font-size:.95rem; text-align:right; color:var(--ink);
  background:rgba(233,221,192,.05); border:1px solid rgba(201,162,39,.3); border-radius:4px;
  padding:.6rem .9rem; cursor:pointer; transition:all .2s;
}
.quiz-opt:hover:not(:disabled){ border-color:var(--gold); background:rgba(201,162,39,.1); }
.quiz-opt.correct{ background:rgba(90,140,70,.25); border-color:#7fae5a; }
.quiz-opt.wrong{ background:rgba(124,34,48,.3); border-color:var(--blood); }
.quiz-opt:disabled{ cursor:default; opacity:.85; }
#quiz-score{ text-align:center; color:var(--gold); font-weight:600; margin-top:.4rem; }

.place-link{ color:#ead489; font-weight:600; cursor:pointer; text-decoration:underline dotted; text-underline-offset:4px; transition:color 0.2s;}
.place-link:hover{ color:#fff; }
.chapter-icon{ margin-bottom:.8rem; }
.chapter-icon svg{ width:56px; height:56px; }

#map-toggle, #whiteboard-toggle {
  position:absolute; bottom:calc(env(safe-area-inset-bottom,0px) + 1.2rem); z-index:6;
  width:44px; height:44px; border-radius:50%; border:1px solid var(--gold-dim);
  background:rgba(20,15,8,.8); font-size:1.3rem; cursor:pointer; color:var(--gold); transition:all 0.2s;
}
#map-toggle:hover, #whiteboard-toggle:hover { background:var(--gold-dim); color:#111; }
#map-toggle{ right:1.2rem; } #whiteboard-toggle{ left:1.2rem; }

#whiteboard-overlay{
  position:fixed; inset:0; z-index:35; background:#f3eee0; opacity:0; pointer-events:none; transition:opacity .35s ease;
}
#whiteboard-overlay.show{ opacity:1; pointer-events:auto; }
#whiteboard-canvas{ position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:crosshair; }
.wb-controls{ position:absolute; top:calc(env(safe-area-inset-top,0px) + 1rem); left:1rem; right:1rem; z-index:2; display:flex; justify-content:space-between; }
.wb-controls button{ font-family:'Tajawal',sans-serif; font-size:.9rem; padding:.5rem 1rem; border-radius:4px; border:1px solid #9c8c5e; background:#fffef8; color:#1c1712; cursor:pointer; font-weight:600;}

#map-overlay{
  position:fixed; inset:0; z-index:30; background:#0a1410; opacity:0; pointer-events:none; transition:opacity .4s ease;
}
#map-overlay.show{ opacity:1; pointer-events:auto; }
#map-leaflet{ position:absolute; inset:0; }
#map-leaflet .leaflet-popup-content-wrapper{ font-family:'Tajawal',sans-serif; text-align:right; direction:rtl; }
.map-controls{ position:absolute; top:calc(env(safe-area-inset-top,0px) + 1rem); left:1rem; z-index:400; display:flex; flex-direction:column; gap:.5rem; }
.map-controls button, #map-close{
  width:38px; height:38px; border-radius:4px; border:1px solid var(--gold-dim); background:rgba(20,15,8,.85);
  color:var(--gold); font-size:1.2rem; cursor:pointer; transition:background 0.2s;
}
.map-controls button:hover, #map-close:hover{ background:var(--gold-dim); color:#000; }
#map-close{ position:absolute; top:calc(env(safe-area-inset-top,0px) + 1rem); right:1rem; z-index:400; font-size:1.1rem; }
.map-title{ position:absolute; bottom:calc(env(safe-area-inset-bottom,0px) + 1rem); left:50%; transform:translateX(-50%); z-index:400; color:#c9bd9d; font-size:.8rem; background:rgba(10,8,5,.8); padding:.4rem 1rem; border-radius:4px; border:1px solid var(--gold-dim); }

#finale{
  position:fixed; inset:0; z-index:20; opacity:0; pointer-events:none; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(ellipse at 50% 35%, #1c4468 0%, #081722 78%);
  transition:opacity 1.1s ease;
}
#finale.show{ opacity:1; pointer-events:auto; }
.wind-line{
  position:absolute; height:2px; right:-25%; width:36%; top:0;
  background:linear-gradient(90deg, transparent, #e6f4ff, transparent); opacity:0;
}
.wind-line.go{ animation:windBlow 1.9s ease-in forwards; }
@keyframes windBlow{
  0%{ transform:translateX(0) translateY(0); opacity:0; }
  12%{ opacity:.85; }
  100%{ transform:translateX(-170vw) translateY(var(--drift,0)); opacity:0; }
}
.finale-box{
  background:rgba(255,255,255,.08); border:1px solid rgba(223,240,255,.4); border-radius:6px;
  padding:2rem 2.4rem; max-width:82%; text-align:center;
  opacity:0; transform:scale(.8); transition:opacity .9s ease .7s, transform .9s ease .7s;
}
#finale.show .finale-box{ opacity:1; transform:scale(1); }
.finale-box p{ font-family:'Amiri',serif; font-size:1.6rem; color:#eaf6ff; line-height:2.3; }
.finale-close{ position:absolute; bottom:calc(env(safe-area-inset-bottom,0px) + 1.6rem); left:50%; transform:translateX(-50%); font-size:.8rem; color:#9fc4de; }
@media(prefers-reduced-motion:reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }
</style>
</head>
<body>

<div class="stage" id="start">
  <div id="icon-wrap">
    <!-- Clash Flash -->
    <div class="clash-flash"></div>
    
    <!-- European Sword (Broadsword) -->
    <svg class="sword-euro" viewBox="0 0 100 100">
      <g transform="translate(50,50) rotate(45) translate(-50,-50)">
        <polygon points="46,75 54,75 50,12" fill="#e9ddc0"/>
        <line x1="50" y1="75" x2="50" y2="25" stroke="#a39678" stroke-width="1"/>
        <rect x="30" y="75" width="40" height="5" fill="#c9a227" rx="1"/>
        <rect x="46" y="80" width="8" height="14" fill="#4a3a15"/>
        <circle cx="50" cy="95" r="4" fill="#c9a227"/>
      </g>
    </svg>
    
    <!-- Arab Sword (Scimitar) -->
    <svg class="sword-arab" viewBox="0 0 100 100">
      <g transform="translate(50,50) rotate(-45) translate(-50,-50)">
        <!-- Beautiful curved blade -->
        <path d="M45,75 Q55,40 50,15 Q72,35 55,75 Z" fill="#e9ddc0"/>
        <rect x="36" y="75" width="28" height="4" fill="#c9a227" rx="1"/>
        <rect x="46" y="79" width="8" height="15" fill="#4a3a15"/>
        <circle cx="50" cy="95" r="4" fill="#c9a227"/>
      </g>
    </svg>
  </div>
  <button id="start-btn">ابدأ</button>
  <div id="loadbar-track"><div id="loadbar-fill"></div></div>
</div>

<div id="black-screen">
  <div id="red-title">الحروب الصليبية</div>
</div>

<div id="deck">
  <button class="arrow-btn" id="prev-btn" aria-label="الفصل السابق">›</button>
  <button class="arrow-btn" id="next-btn" aria-label="الفصل التالي">‹</button>
  <div id="pages"></div>
  <div class="dots" id="dots"></div>
  <div class="hint" id="hint">اسحب للتنقّل بين الفصول</div>
  <button id="map-toggle" aria-label="فتح خريطة الحروب الصليبية" title="الخريطة">🗺</button>
  <button id="whiteboard-toggle" aria-label="فتح السبورة البيضاء" title="السبورة">🖊</button>
</div>

<div id="finale">
  <div class="finale-box"><p>وهذا وصلى الله وسلم وبارك على نبينا محمد وعلى آله وصحبه أجمعين.</p></div>
  <div class="finale-close">اضغط في أي مكان للعودة</div>
</div>

<div id="map-overlay">
  <div class="map-controls">
    <button id="map-zoom-in" aria-label="تكبير الخريطة">+</button>
    <button id="map-zoom-out" aria-label="تصغير الخريطة">−</button>
  </div>
  <button id="map-close" aria-label="إغلاق الخريطة">✕</button>
  <div id="map-leaflet"></div>
  <div class="map-title">خريطة تفاعلية — انقر على المواقع المظللة في النص للتركيز عليها</div>
</div>

<div id="whiteboard-overlay">
  <div class="wb-controls">
    <button id="wb-clear">مسح السبورة</button>
    <button id="wb-close">إغلاق ✕</button>
  </div>
  <canvas id="whiteboard-canvas"></canvas>
</div>

<script>
const ICONS = {
  spark:`<svg viewBox="0 0 64 64" fill="none" stroke="#c9a227" stroke-width="2"><circle cx="24" cy="32" r="15"/><circle cx="40" cy="32" r="15"/></svg>`,
  fortress:`<svg viewBox="0 0 64 64" fill="none" stroke="#c9a227" stroke-width="2"><rect x="16" y="26" width="32" height="28"/><path d="M16 26v-8h6v4h6v-4h8v4h6v-4h6v8"/></svg>`,
  ship:`<svg viewBox="0 0 64 64" fill="none" stroke="#c9a227" stroke-width="2"><path d="M10 40h44l-8 12H18Z"/><line x1="32" y1="40" x2="32" y2="12"/><path d="M32 14l16 10-16 6Z" fill="#c9a227" stroke="none"/></svg>`,
  crescent:`<svg viewBox="0 0 64 64"><path d="M40 12a20 20 0 1 0 0 40 16 16 0 1 1 0-40Z" fill="#c9a227"/></svg>`
};

const chapters = [
  { eyebrow:"مقدّمة", title:"عالمان على حافة الصدام", icon:"spark",
    body:"في نهاية القرن الحادي عشر، وبعد الهزيمة المدوية للبيزنطيين في معركة <span class=\"place-link\" data-place=\"manzikert\">ملاذكرد</span> (١٠٧١م) أمام السلاجقة، استنجد الإمبراطور البيزنطي ألكسيوس الأول بالبابا أوربان الثاني. استجاب البابا وأطلق شرارة الحملات بمجمع كليرمونت (١٠٩٥م)، واعداً بالغفران لمن يشارك في استعادة الأراضي المقدسة. هكذا انطلقت موجات عسكرية ضخمة من الغرب استمرت لقرنين، مغيرة وجه التاريخ." },
  
  { eyebrow:"١٠٩٦ – ١١٩٢م", title:"الحملات الأولى والثانية والثالثة", icon:"fortress",
    body:"أسفرت الحملة الأولى عن مذابح مروعة وسقوط <span class=\"place-link\" data-place=\"jerusalem\">القدس</span> (١٠٩٩م) وتأسيس أربع إمارات صليبية. بعد استرداد عماد الدين زنكي لمدينة الرها، انطلقت الحملة الثانية وفشلت. ثم بزغ نجم السلطان صلاح الدين الأيوبي، الذي وحد مصر والشام، وسحق جيش الصليبيين في <span class=\"place-link\" data-place=\"hattin\">حطين</span> (١١٨٧م) مسترداً القدس. ردت أوروبا بالحملة الثالثة بقيادة ريتشارد قلب الأسد، التي انتهت بصلح الرملة وبقاء القدس إسلامية مع السماح للحجاج المسيحيين بزيارتها." },
  
  { eyebrow:"١٢٠٢ – ١٢٢٩م", title:"الحملات الرابعة والخامسة والسادسة", icon:"ship",
    body:"انحرفت الحملة الرابعة بشكل مأساوي لنهب <span class=\"place-link\" data-place=\"constantinople\">القسطنطينية</span> المسيحية (١٢٠٤م) بدفع من البندقية. أما الخامسة فاستهدفت مصر للضغط على الشام، لكنها غرقت في فيضانات النيل وصمود الأيوبيين. في الحملة السادسة، استغل الإمبراطور فريدريك الثاني صراع السلطان الأيوبي الكامل مع إخوته، وعقد معه معاهدة يافا (١٢٢٩م) التي سُلّمت بموجبها القدس سلمياً للصليبيين لعشر سنوات دون إراقة قطرة دم." },
  
  { eyebrow:"١٢٤٨ – ١٢٩١م", title:"الحملات السابعة والثامنة والتاسعة", icon:"crescent",
    body:"قاد لويس التاسع الحملة السابعة وانتهت بأسره في <span class=\"place-link\" data-place=\"mansoura\">المنصورة</span>. تزامناً مع ذلك، أسس المماليك دولتهم وأنقذوا العالم الإسلامي بسحق المغول في عين جالوت (١٢٦٠م) بقيادة قطز وبيبرس. بدأ الظاهر بيبرس ثم قلاوون بتفكيك الحصون الصليبية بضراوة لا هوادة فيها، حتى جاء السلطان الأشرف خليل ليفتح <span class=\"place-link\" data-place=\"acre\">عكا</span> (١٢٩١م)، آخر معاقلهم الكبرى، منهياً بذلك الوجود الصليبي في المشرق نهائياً." },
  
  { eyebrow:"خلاصة", title:"الحروب الصليبية بالأرقام", type:"stats",
    stats:[
      {num:"٩", label:"حملات رئيسية"},
      {num:"١٠٩٩", label:"سقوط القدس"},
      {num:"١١٨٧", label:"انتصار حطين"},
      {num:"١٢٦٠", label:"معركة عين جالوت"},
      {num:"١٢٩١", label:"تحرير عكا"},
      {num:"١٩٥", label:"عاماً من الصراع"}
    ]},
  
  { eyebrow:"اختبر نفسك", title:"اختبار سريع", type:"quiz",
    quiz:[
      { q:"أي معركة حاسمة أوقف فيها المماليك زحف المغول عام ١٢٦٠م؟", opts:["حطين","مؤتة","عين جالوت","اليرموك"], correct:2 },
      { q:"أين تم أسر الملك لويس التاسع خلال الحملة السابعة؟", opts:["عكا","المنصورة","القدس","دمشق"], correct:1 },
      { q:"من أطلق الدعوة إلى الحملة الصليبية الأولى بمجمع كليرمونت؟", opts:["صلاح الدين","أوربان الثاني","لويس التاسع","ريتشارد قلب الأسد"], correct:1 },
      { q:"أي قوة أنهت الوجود الصليبي في الشام تماماً بسقوط عكا؟", opts:["الفاطميون","السلاجقة","المماليك","العباسيون"], correct:2 }
    ]}
];

const pagesEl = document.getElementById('pages');
const dotsEl = document.getElementById('dots');
chapters.forEach((c,i)=>{
  const p = document.createElement('div');
  p.className = 'page' + (i===0 ? ' active' : ' next');
  if(c.type === 'stats'){
    const grid = c.stats.map(s=>`<div class="stat-block"><div class="stat-num">${s.num}</div><div class="stat-label">${s.label}</div></div>`).join('');
    p.innerHTML = `<div class="page-box"><div class="eyebrow">${c.eyebrow}</div><h2>${c.title}</h2><div class="stats-grid">${grid}</div></div>`;
  } else if(c.type === 'quiz'){
    const qs = c.quiz.map((q,qi)=>{
      const opts = q.opts.map((o,oi)=>`<button class="quiz-opt" data-q="${qi}" data-o="${oi}">${o}</button>`).join('');
      return `<div class="quiz-q"><p>${qi+1}. ${q.q}</p><div class="quiz-opts">${opts}</div></div>`;
    }).join('');
    p.innerHTML = `<div class="page-box"><div class="eyebrow">${c.eyebrow}</div><h2>${c.title}</h2><div class="quiz-wrap">${qs}<div id="quiz-score">النتيجة: ٠ / ${c.quiz.length}</div></div></div>`;
  } else {
    p.innerHTML = `<div class="page-box"><div class="chapter-icon">${ICONS[c.icon]||''}</div><div class="eyebrow">${c.eyebrow}</div><h2>${c.title}</h2><p>${c.body}</p></div>`;
  }
  pagesEl.appendChild(p);
  const d = document.createElement('div');
  d.className = 'dot' + (i===0 ? ' active' : '');
  d.title = c.eyebrow || c.title;
  dotsEl.appendChild(d);
});

const quizChapterIdx = chapters.findIndex(c=>c.type==='quiz');
if(quizChapterIdx > -1){
  let score = 0;
  const quizData = chapters[quizChapterIdx].quiz;
  const scoreEl = pagesEl.children[quizChapterIdx].querySelector('#quiz-score');
  pagesEl.children[quizChapterIdx].querySelectorAll('.quiz-opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const qi = +btn.dataset.q, oi = +btn.dataset.o;
      const group = pagesEl.children[quizChapterIdx].querySelectorAll(`.quiz-opt[data-q="${qi}"]`);
      if(group[0].disabled) return;
      group.forEach(b=>{
        b.disabled = true;
        if(+b.dataset.o === quizData[qi].correct) b.classList.add('correct');
        else if(b === btn) b.classList.add('wrong');
      });
      if(oi === quizData[qi].correct) score++;
      scoreEl.textContent = `النتيجة: ${score} / ${quizData.length}`;
    });
  });
}

const pageEls = [...pagesEl.children];
const dotEls = [...dotsEl.children];
const hintEl = document.getElementById('hint');
const lastIdx = chapters.length - 1;
let idx = 0;

function render(){
  pageEls.forEach((p,i)=>{
    p.classList.remove('active','next','prev');
    if(i===idx) p.classList.add('active');
    else if(i<idx) p.classList.add('prev');
    else p.classList.add('next');
  });
  dotEls.forEach((d,i)=> d.classList.toggle('active', i===idx));
  hintEl.textContent = idx===lastIdx ? 'اسحب للأعلى للختام' : 'اسحب للتنقّل بين الفصول';
}

function go(delta){
  const n = idx + delta;
  if(n<0 || n>=chapters.length) return;
  idx = n; render();
  playPageTurn();
}
document.getElementById('next-btn').onclick = ()=>go(1);
document.getElementById('prev-btn').onclick = ()=>go(-1);

const mapOverlay = document.getElementById('map-overlay');
const PLACES = {
  jerusalem:      { latlng:[31.7683, 35.2137], label:"القدس (محور الصراع)" },
  hattin:         { latlng:[32.8130, 35.4479], label:"حطين (معركة ١١٨٧م)" },
  acre:           { latlng:[32.9281, 35.0818], label:"عكا (سقطت ١٢٩١م)" },
  constantinople: { latlng:[41.0082, 28.9784], label:"القسطنطينية (الحملة الرابعة)" },
  manzikert:      { latlng:[39.1418, 42.5404], label:"ملاذكرد (معركة ١٠٧١م)" },
  mansoura:       { latlng:[31.0409, 31.3785], label:"المنصورة (أُسر فيها لويس التاسع)" }
};
let map = null, mapMarkers = {};
delete L.Icon.Default.prototype._getIconUrl;
L.Icon.Default.mergeOptions({
  iconRetinaUrl:'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/images/marker-icon-2x.png',
  iconUrl:'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/images/marker-icon.png',
  shadowUrl:'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/images/marker-shadow.png'
});

function initMap(){
  if(map) return;
  map = L.map('map-leaflet', {
    zoomControl:false, maxBounds:[[20,-10],[55,55]], maxBoundsViscosity:1.0, minZoom:4, maxZoom:10
  }).setView(PLACES.jerusalem.latlng, 5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'&copy; OpenStreetMap contributors'
  }).addTo(map);
  Object.entries(PLACES).forEach(([key,p])=>{
    mapMarkers[key] = L.marker(p.latlng).addTo(map).bindPopup(p.label);
  });
}
function centerMapOn(place){
  const p = PLACES[place];
  if(!p) return;
  map.flyTo(p.latlng, 6, {duration:1.2});
  setTimeout(()=> mapMarkers[place].openPopup(), 1200);
}
function openMap(place){
  mapOverlay.classList.add('show');
  initMap();
  setTimeout(()=>{ map.invalidateSize(); if(place) centerMapOn(place); }, 100);
}
function closeMap(){ mapOverlay.classList.remove('show'); }
document.getElementById('map-toggle').onclick = ()=>openMap();
document.getElementById('map-close').onclick = closeMap;
document.getElementById('map-zoom-in').onclick = ()=> map && map.zoomIn();
document.getElementById('map-zoom-out').onclick = ()=> map && map.zoomOut();
window.addEventListener('keydown', e=>{ if(e.key==='Escape' && mapOverlay.classList.contains('show')) closeMap(); });

pagesEl.addEventListener('click', e=>{
  const link = e.target.closest('.place-link');
  if(link) openMap(link.dataset.place);
});

const wbOverlay = document.getElementById('whiteboard-overlay');
const wbCanvas = document.getElementById('whiteboard-canvas');
let wbCtx = null, wbDrawing = false, wbLast = null;
function wbResize(){
  wbCanvas.width = window.innerWidth; wbCanvas.height = window.innerHeight;
  wbCtx = wbCanvas.getContext('2d');
  wbCtx.lineWidth = 3; wbCtx.lineCap = 'round'; wbCtx.lineJoin = 'round'; wbCtx.strokeStyle = '#1c1712';
}
function wbStart(x,y){ wbDrawing = true; wbLast = {x,y}; }
function wbDraw(x,y){
  if(!wbDrawing || !wbCtx) return;
  wbCtx.beginPath(); wbCtx.moveTo(wbLast.x, wbLast.y); wbCtx.lineTo(x,y); wbCtx.stroke();
  wbLast = {x,y};
}
function wbEnd(){ wbDrawing = false; }
document.getElementById('whiteboard-toggle').onclick = ()=>{ wbOverlay.classList.add('show'); wbResize(); };
document.getElementById('wb-close').onclick = ()=> wbOverlay.classList.remove('show');
document.getElementById('wb-clear').onclick = ()=>{ if(wbCtx) wbCtx.clearRect(0,0,wbCanvas.width,wbCanvas.height); };
wbCanvas.addEventListener('mousedown', e=> wbStart(e.clientX, e.clientY));
window.addEventListener('mousemove', e=> wbDraw(e.clientX, e.clientY));
window.addEventListener('mouseup', wbEnd);
wbCanvas.addEventListener('touchstart', e=>{ const t=e.touches[0]; wbStart(t.clientX, t.clientY); }, {passive:true});
wbCanvas.addEventListener('touchmove', e=>{ const t=e.touches[0]; wbDraw(t.clientX, t.clientY); e.preventDefault(); }, {passive:false});
wbCanvas.addEventListener('touchend', wbEnd, {passive:true});
window.addEventListener('resize', ()=>{ if(wbOverlay.classList.contains('show')) wbResize(); });

let touchX = null, touchY = null;
const deck = document.getElementById('deck');
deck.addEventListener('touchstart', e=>{ touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; }, {passive:true});
deck.addEventListener('touchend', e=>{
  if(touchX===null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  const dy = e.changedTouches[0].clientY - touchY;
  if(Math.abs(dy) > Math.abs(dx) && dy < -50){
    if(idx===lastIdx) triggerFinale();
  } else if(Math.abs(dx) > 40){
    go(dx < 0 ? -1 : 1);
  }
  touchX = null; touchY = null;
}, {passive:true});
let wheelLock = false;
deck.addEventListener('wheel', e=>{
  if(idx===lastIdx && e.deltaY < -25 && !wheelLock){
    wheelLock = true; triggerFinale();
    setTimeout(()=> wheelLock=false, 1500);
  }
}, {passive:true});
window.addEventListener('keydown', e=>{
  if(!deck.classList.contains('show')) return;
  if(e.key==='ArrowLeft') go(1);
  if(e.key==='ArrowRight') go(-1);
  if(e.key==='ArrowUp' && idx===lastIdx) triggerFinale();
});
document.getElementById('finale').addEventListener('click', ()=>{ document.getElementById('finale').classList.remove('show'); });

let audioCtx = null;
function getCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playClank(){
  try{
    const ctx = getCtx();
    const t = ctx.currentTime;
    
    // Metallic clash high-frequencies
    const osc = ctx.createOscillator();
    const osc2 = ctx.createOscillator();
    const gain = ctx.createGain();
    
    osc.type = 'square';
    osc2.type = 'triangle';
    
    osc.frequency.setValueAtTime(1200, t);
    osc.frequency.exponentialRampToValueAtTime(300, t + 0.1);
    
    osc2.frequency.setValueAtTime(1800, t);
    osc2.frequency.exponentialRampToValueAtTime(400, t + 0.15);
    
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(1, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.5);
    
    osc.connect(gain);
    osc2.connect(gain);
    gain.connect(ctx.destination);
    
    osc.start(t); osc.stop(t + 0.6);
    osc2.start(t); osc2.stop(t + 0.6);

    // Deep thud/boom for weight
    const boomOsc = ctx.createOscillator();
    const boomGain = ctx.createGain();
    boomOsc.type = 'sine';
    boomOsc.frequency.setValueAtTime(120, t);
    boomOsc.frequency.exponentialRampToValueAtTime(40, t + 0.4);
    boomGain.gain.setValueAtTime(0, t);
    boomGain.gain.linearRampToValueAtTime(1, t + 0.03);
    boomGain.gain.exponentialRampToValueAtTime(0.01, t + 1.2);
    boomOsc.connect(boomGain);
    boomGain.connect(ctx.destination);
    boomOsc.start(t); boomOsc.stop(t + 1.5);
  }catch(e){}
}

function playPageTurn(){
  try{
    const ctx = getCtx();
    const dur = 0.35;
    const buf = ctx.createBuffer(1, ctx.sampleRate*dur, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0;i<data.length;i++){
      const t = i/data.length;
      data[i] = (Math.random()*2-1) * Math.pow(1-t, 1.6);
    }
    const src = ctx.createBufferSource(); src.buffer = buf;
    const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value = 1000;
    const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 4000;
    const trem = ctx.createGain(); trem.gain.value = 0.5;
    const lfo = ctx.createOscillator(); lfo.type='sine'; lfo.frequency.value = 40;
    const lfoGain = ctx.createGain(); lfoGain.gain.value = 0.4;
    lfo.connect(lfoGain); lfoGain.connect(trem.gain);
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime+0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
    src.connect(hp); hp.connect(lp); lp.connect(trem); trem.connect(gain); gain.connect(ctx.destination);
    lfo.start(); lfo.stop(ctx.currentTime+dur);
    src.start(); src.stop(ctx.currentTime+dur);
  }catch(e){}
}

function playWind(){
  try{
    const ctx = getCtx();
    const dur = 2.2;
    const buf = ctx.createBuffer(1, ctx.sampleRate*dur, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0;i<data.length;i++) data[i] = Math.random()*2-1;
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = false;
    const filt = ctx.createBiquadFilter(); filt.type='bandpass'; filt.Q.value=0.5;
    filt.frequency.setValueAtTime(300, ctx.currentTime);
    filt.frequency.linearRampToValueAtTime(1200, ctx.currentTime+dur*0.5);
    filt.frequency.linearRampToValueAtTime(250, ctx.currentTime+dur);
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.22, ctx.currentTime+0.4);
    gain.gain.linearRampToValueAtTime(0, ctx.currentTime+dur);
    src.connect(filt); filt.connect(gain); gain.connect(ctx.destination);
    src.start();
  }catch(e){}
}

function triggerFinale(){
  const finale = document.getElementById('finale');
  finale.querySelectorAll('.wind-line').forEach(l=>l.remove());
  for(let i=0;i<16;i++){
    const l = document.createElement('div');
    l.className = 'wind-line go';
    l.style.top = (Math.random()*100)+'%';
    l.style.setProperty('--drift', (Math.random()*40-20)+'px');
    l.style.animationDelay = (Math.random()*0.8)+'s';
    l.style.width = (20+Math.random()*25)+'%';
    finale.insertBefore(l, finale.firstChild);
  }
  finale.classList.add('show');
  playWind();
}

document.getElementById('start-btn').addEventListener('click', ()=>{
  const btn = document.getElementById('start-btn');
  const iconWrap = document.getElementById('icon-wrap');
  const track = document.getElementById('loadbar-track');
  const fill = document.getElementById('loadbar-fill');
  
  btn.disabled = true; btn.style.visibility = 'hidden';
  iconWrap.classList.add('animating');
  track.classList.add('show');
  
  // Audio syncs perfectly with the 0.15s delay of the flash animation
  setTimeout(playClank, 150);
  
  requestAnimationFrame(()=> fill.style.width = '100%');

  setTimeout(()=>{
    document.getElementById('start').style.opacity = '0';
    const blackScreen = document.getElementById('black-screen');
    
    blackScreen.classList.add('show');
    setTimeout(()=> document.getElementById('start').style.display='none', 650);

    setTimeout(()=>{
      const redTitle = document.getElementById('red-title');
      redTitle.classList.add('show');
      
      setTimeout(()=>{
        redTitle.classList.remove('show');
        setTimeout(()=>{
          blackScreen.classList.remove('show');
          setTimeout(()=>{
            blackScreen.style.display = 'none';
            document.getElementById('deck').classList.add('show');
          }, 700);
        }, 700);
      }, 1500);
    }, 800);
  }, 2200);
});
</script>
